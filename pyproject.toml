[project]
name = "autoreviewer"
version = "0.1.0"
description = "Prism: a conversational GitHub PR reviewer built on pydantic-ai-harness."
requires-python = ">=3.13"
dependencies = [
    # Exact pins: the harness is 0.x and pins pydantic-ai-slim to the same release.
    "pydantic-ai-harness==0.68.0",
    "pydantic-ai-slim[openai]==2.68.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # The same HTTP client githubkit uses; plain httpx stays only as a transitive dependency
    # (the openai SDK behind pydantic-ai's OpenAI provider requires it).
    "httpx2>=2.16.2",
    "githubkit[auth-app]>=0.12",
    "dbos>=1.0",
    # Enforces type annotations on PRs (review/lint.py), so it's a runtime dependency. Exact pin: a new
    # ruff release can change what a rule flags, and the bot's verdicts shouldn't change with it.
    "ruff==0.17.5",
    # Tracing (agent runs, webhooks, logs). Sends nothing until LOGFIRE_TOKEN is set; see telemetry.py.
    "logfire[fastapi]==5.6.0",
]

[project.optional-dependencies]
# Only sandboxd embeds the smolvm engine (libkrun); the web receiver's image must not ship it.
sandboxd = ["pydantic-ai-harness[smol]==0.68.0"]
claude-code = [
    "pydantic-claude-code==0.7.6 ; python_full_version < '3.15'",
]

[project.scripts]
prism-config = "autoreviewer.config_cli:main"
autoreviewer-sandboxd = "autoreviewer.sandbox.daemon:main"
autoreviewer-web = "autoreviewer.web.app:main"
autoreviewer-review-pr = "autoreviewer.ondemand:main"

[dependency-groups]
dev = ["pytest>=8", "anyio>=4", "pyright>=1.1.390", "pydantic-ai-harness[smol]==0.68.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoreviewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smolvm: needs /dev/kvm and the smolmachines engine (slow, boots real microVMs)"]
addopts = "-m 'not smolvm'"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# ANN0/ANN2/ANN401/PGH003: the typing rules the bot enforces on PRs (review/lint.py), applied to itself.
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ANN0", "ANN2", "ANN401", "PGH003"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
