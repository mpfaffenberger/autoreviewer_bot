[project]
name = "autoreviewer"
version = "0.1.0"
description = "Macroscope-style GitHub PR reviewer on chaos-emerald models, built on pydantic-ai-harness."
requires-python = ">=3.13"
dependencies = [
    # Exact pins: the harness is 0.x and pins pydantic-ai-slim to the same release.
    "pydantic-ai-harness==0.68.0",
    "pydantic-ai-slim[openai]==2.68.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "githubkit[auth-app]>=0.12",
    "dbos>=1.0",
]

[project.optional-dependencies]
# Only sandboxd embeds the smolvm engine (libkrun); the web receiver's image must not ship it.
sandboxd = ["pydantic-ai-harness[smol]==0.68.0"]

[project.scripts]
autoreviewer-sandboxd = "autoreviewer.sandbox.daemon:main"
autoreviewer-web = "autoreviewer.web.app:main"

[dependency-groups]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.8", "pyright>=1.1.390", "pydantic-ai-harness[smol]==0.68.0", "httpx2>=2.16.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoreviewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smolvm: needs /dev/kvm and the smolmachines engine (slow, boots real microVMs)"]
addopts = "-m 'not smolvm'"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
