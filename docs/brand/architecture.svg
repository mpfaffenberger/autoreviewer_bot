<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1080" viewBox="0 0 1120 1080" role="img" aria-labelledby="title desc">
<title id="title">Prism · pull request review architecture</title>
<desc id="desc">Signed GitHub events start durable review jobs. A finder and an independent checker inspect a git workspace; application code alone posts the review. Thread replies trigger a separate code check. Review memory stays outside optional microVMs, and the local CLI never posts.</desc>
<defs>
  <linearGradient id="night" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#071c21"/><stop offset="1" stop-color="#0e3030"/></linearGradient>
  <linearGradient id="glass" x2="0.9" y2="1"><stop stop-color="#ceffac"/><stop offset=".52" stop-color="#46dba1"/><stop offset="1" stop-color="#157b74"/></linearGradient>
  <marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#77e2b5"/></marker>
</defs>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#effaf4}.tag{font-size:14px;font-weight:bold;letter-spacing:1.2px;fill:#93e9be}.body{font-size:18px;fill:#d5e8df}.head{font-size:24px;font-weight:bold}.wire{fill:none;stroke:#77e2b5;stroke-width:2;marker-end:url(#tip)}</style>
<rect width="1120" height="1080" fill="url(#night)"/>
<!-- Incident light splits across three facets. -->
<g stroke-linejoin="round"><path d="M0 82H63" stroke="#e7fcae" stroke-width="4"/><path d="m51 100 46-75 38 76-46 21z" fill="url(#glass)" stroke="#b0ffcb"/><path d="m97 25-8 97 46-21z" fill="#218b72"/><path d="m51 100 49-30 35 31-46 21z" fill="#5ad8a8" opacity=".7"/><path d="m97 25 3 45-11 52" stroke="#caffd0" fill="none"/><path d="m119 68 43-21m-37 32 37-4m-32 16 32 10" stroke="#7eeeb7" stroke-width="2"/></g>
<text x="187" y="39" class="tag" >PRISM   /   SYSTEM ARCHITECTURE</text>
<text x="184" y="91" class="head" style="font-size:46px">Inside a pull request review</text>
<text x="187" y="125" class="body" >Models investigate. Application code decides what reaches GitHub.</text>
<rect x="32" y="154" width="1056" height="97" rx="12" fill="#1c393a" stroke="#6c9482" stroke-width="1.5" />
<text x="54" y="185" class="tag" >EXTERNAL  /  GITHUB</text>
<text x="54" y="220" class="head" >Pull request</text>
<text x="255" y="190" class="body" >Open, push or request a review</text>
<text x="255" y="219" class="body" >Diff, head SHA and repository context</text>
<text x="795" y="190" class="head" >Review threads</text>
<text x="795" y="219" class="body" >Findings, replies and verdicts</text>
<rect x="32" y="291" width="707" height="756" rx="12" fill="#102e31" stroke="#589b83" stroke-width="1.5" />
<text x="54" y="320" class="tag" >TRUSTED RECEIVER  /  GITHUB APP + PROVIDER CREDENTIALS</text>
<rect x="54" y="343" width="631" height="110" rx="12" fill="#153638" stroke="#3b6963" stroke-width="1.5" />
<text x="73" y="375" class="head" >01   Verify and enqueue</text>
<text x="73" y="407" class="body" >FastAPI verifies the webhook signature and routes the event.</text>
<text x="73" y="432" class="body" >Active requests share a review; crash recovery resumes its budget.</text>
<path class="wire" d="M88 251V289"/>
<path class="wire" d="M365 453V482"/>
<rect x="54" y="484" width="631" height="231" rx="12" fill="#143b37" stroke="#6ab596" stroke-width="1.5" />
<text x="73" y="514" class="head" >02   Review the head against its merge base</text>
<text x="73" y="544" class="body" >Pydantic AI agents use scoped git and file tools, not GitHub tokens.</text>
<rect x="71" y="561" width="267" height="103" rx="12" fill="#1d4941" stroke="#3b6963" stroke-width="1.5" />
<rect x="383" y="561" width="285" height="103" rx="12" fill="#1d4941" stroke="#3b6963" stroke-width="1.5" />
<text x="87" y="587" class="tag" >FINDER</text>
<text x="87" y="617" class="body" >Correctness, security, DRY;</text>
<text x="87" y="642" class="body" >docs and tests are opt-in.</text>
<text x="400" y="587" class="tag" >INDEPENDENT CHECKER</text>
<text x="400" y="617" class="body" >Reads the code to confirm,</text>
<text x="400" y="642" class="body" >correct or reject each claim.</text>
<path class="wire" d="M339 612H381"/>
<text x="73" y="696" class="body" >Model selection: PRISM_CONFIG points to prism.json.</text>
<path class="wire" d="M365 715V741"/>
<rect x="54" y="743" width="631" height="132" rx="12" fill="#153638" stroke="#3b6963" stroke-width="1.5" />
<text x="73" y="777" class="head" >03   Anchor findings and post</text>
<text x="73" y="807" class="body" >Deduplicate and map findings to changed lines. App code posts</text>
<text x="73" y="832" class="body" >inline comments and the verdict; an incomplete blocking review</text>
<text x="73" y="857" class="body" >cannot approve. Tool-proven lint needs no model confirmation.</text>
<path class="wire" d="M685 794H710V253"/>
<rect x="54" y="891" width="663" height="133" rx="12" fill="#10292c" stroke="#477c73" stroke-width="1.5" />
<text x="73" y="920" class="tag" >PRIVATE STATE  /  RECEIVER DISK</text>
<text x="73" y="950" class="body" >SQLite stores DBOS checkpoints. Per-PR files keep lens history and</text>
<text x="73" y="975" class="body" >the last successful review index for a compatible follow-up push.</text>
<text x="73" y="1000" class="body" >Closing the PR clears its memory. Guests cannot access it.</text>
<rect x="773" y="291" width="315" height="191" rx="12" fill="#1d353a" stroke="#739e9b" stroke-width="1.5" />
<text x="793" y="322" class="tag" >FEEDBACK  /  REPLY JOB</text>
<text x="793" y="357" class="head" >Recheck the finding</text>
<text x="793" y="389" class="body" >A thread reply is evidence, not</text>
<text x="793" y="414" class="body" >an instruction. Check the head;</text>
<text x="793" y="439" class="body" >explain or withdraw. The thread</text>
<text x="793" y="464" class="body" >marker informs later verdicts.</text>
<path class="wire" d="M842 251V289"/>
<path class="wire" d="M1031 291V253"/>
<rect x="773" y="512" width="315" height="212" rx="12" fill="#182e35" stroke="#b0b58c" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="793" y="544" class="tag" >OPTIONAL  /  ISOLATED EXEC</text>
<text x="793" y="581" class="head" >Sandbox daemon</text>
<text x="793" y="615" class="body" >Unix socket to sandboxd,</text>
<text x="793" y="640" class="body" >running as a separate OS user.</text>
<text x="793" y="665" class="body" >A microVM runs untrusted code</text>
<text x="793" y="690" class="body" >with limited egress, no App keys</text>
<text x="793" y="715" class="body" >and no trusted review memory.</text>
<path class="wire" d="M685 592H771" stroke-dasharray="5 4"/>
<rect x="773" y="757" width="315" height="267" rx="12" fill="#153335" stroke="#5e807b" stroke-width="1.5" />
<text x="793" y="789" class="tag" >ALTERNATE ENTRY  /  CLI</text>
<text x="793" y="826" class="head" >Preview a verdict</text>
<text x="793" y="862" class="body" >autoreviewer-review-pr</text>
<text x="793" y="887" class="body" >reads a PR by URL or number</text>
<text x="793" y="912" class="body" >and runs the same pipeline.</text>
<text x="793" y="937" class="body" >No App installation required.</text>
<path d="M793 957h273" stroke="#426761"/>
<text x="793" y="994" class="body" >Stdout + exit code. Never posts.</text>
<path class="wire" d="M773 850H754V682H687" stroke-dasharray="5 4"/>
</svg>
